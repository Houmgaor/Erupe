# MHF patch server on nginx — serves the tree described in the Erupe wiki
# (Client-Distribution). Include this from a `server { }` block that listens
# on port 80. It must stay plain HTTP: the original launcher (mhl.dll) does
# not speak TLS, so NEVER add a http -> https redirect on this vhost. Listening
# on 443 as well, for browsers, is fine.
#
# Request shapes issued by the client (User-Agent: mhfhttp):
#   GET /mhf_file.php?key=<n>              manifest, saved locally as MHFUP_00.DAT
#   GET /mhf_file.php?chk=<n>              expects the text "[mhf Check Message:0]"
#   GET /mhfdat/<exe|dat>/<file>?id=<n>    one file
# <n> is a cache-buster and is ignored.
#
# Expected layout under $patch_root:
#   key.txt                 manifest generated by genMhfKey.py (rename key00.txt)
#   chk.txt                 exactly: [mhf Check Message:0]
#   mhfdat/exe/…            files that live next to mhf.exe
#   mhfdat/dat/…            the game's dat/ folder

set $patch_root /var/www/patch;

location = /mhf_file.php {
    root $patch_root;
    default_type application/octet-stream;
    if ($args ~ "(^|&)key(=|&|$)") {
        add_header Content-Disposition 'inline; filename="MHFUP_00.DAT"';
        rewrite ^ /key.txt break;
    }
    if ($args ~ "(^|&)chk(sha)?(=|&|$)") {
        rewrite ^ /chk.txt break;
    }
    return 404;
}

location /mhfdat/ {
    root $patch_root;
    default_type application/octet-stream;
    autoindex off;
    sendfile on;
    tcp_nopush on;
}
