openapi: 3.1.0
info:
  title: Erupe API
  description: REST API for the Erupe Monster Hunter Frontier server emulator.
  version: 2.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /v2/login:
    post:
      summary: Authenticate user
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthData"
        "400":
          description: Invalid credentials or malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_username:
                  value:
                    error: invalid_username
                    message: Username not found
                invalid_password:
                  value:
                    error: invalid_password
                    message: Incorrect password
                invalid_request:
                  value:
                    error: invalid_request
                    message: Malformed request body
        "500":
          $ref: "#/components/responses/InternalError"

  /v2/register:
    post:
      summary: Create new user account
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthData"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_fields:
                  value:
                    error: missing_fields
                    message: Username and password required
                username_exists:
                  value:
                    error: username_exists
                    message: Username already taken
                invalid_request:
                  value:
                    error: invalid_request
                    message: Malformed request body
        "500":
          $ref: "#/components/responses/InternalError"

  /v2/launcher:
    get:
      summary: Get launcher UI data
      operationId: getLauncher
      tags: [public]
      responses:
        "200":
          description: Launcher banners, messages, and links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LauncherResponse"

  /v2/version:
    get:
      summary: Get server version
      operationId: getVersion
      tags: [public]
      responses:
        "200":
          description: Server version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v2/health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [public]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Server is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v2/server/status:
    get:
      summary: Get server status
      operationId: getServerStatus
      tags: [public]
      responses:
        "200":
          description: Current server status including events and MezFes schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatusResponse"

  /v2/characters:
    post:
      summary: Create a new character
      operationId: createCharacter
      tags: [characters]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v2/characters/{id}/delete:
    post:
      summary: Delete a character (POST form)
      operationId: deleteCharacterPost
      tags: [characters]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/characterId"
      responses:
        "200":
          description: Character deleted
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: Invalid character ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v2/characters/{id}:
    delete:
      summary: Delete a character
      operationId: deleteCharacter
      tags: [characters]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/characterId"
      responses:
        "200":
          description: Character deleted
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: Invalid character ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v2/characters/{id}/export:
    get:
      summary: Export character save data
      operationId: exportSave
      tags: [characters]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/characterId"
      responses:
        "200":
          description: Full character data for backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: Invalid character ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Operator endpoints ───────────────────────────────────────────────────
  # All /v2/admin routes take the same bearer token as the player endpoints
  # and additionally require users.op = true (403 otherwise). Every mutation
  # is logged with the operator's user ID.

  /v2/admin/users:
    get:
      summary: Search accounts
      operationId: adminSearchUsers
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string }, description: Case-insensitive username substring }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v2/admin/users/{id}:
    get:
      summary: Account detail with characters
      operationId: adminGetUser
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Account and its characters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AdminUser"
                  - type: object
                    properties:
                      characters: { type: array, items: { $ref: "#/components/schemas/Character" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Grant/revoke operator rights or set the rights bitfield
      operationId: adminUpdateUser
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                op: { type: boolean }
                rights: { type: integer, description: Course bitfield, see wiki Enumerations }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400":
          description: Neither field given, or an operator removing their own op flag (`self_demotion`)
        "404": { $ref: "#/components/responses/NotFound" }

  /v2/admin/users/{id}/password:
    post:
      summary: Reset an account password
      operationId: adminSetPassword
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Password replaced }
        "404": { $ref: "#/components/responses/NotFound" }

  /v2/admin/users/{id}/ban:
    post:
      summary: Ban an account (permanent unless `expires` is given)
      operationId: adminBan
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires: { type: string, format: date-time }
      responses:
        "204": { description: Banned }
        "400": { description: Expiry in the past, or banning yourself (`self_ban`) }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Lift a ban
      operationId: adminUnban
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Unbanned (also when there was no ban) }

  /v2/admin/notices:
    get:
      summary: List login notices
      operationId: adminListNotices
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: all, schema: { type: string }, description: Any value includes expired notices }
      responses:
        "200":
          description: Notices
          content:
            application/json:
              schema:
                type: object
                properties:
                  notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
    post:
      summary: Add a login notice
      description: Shown at sign-in after the static `LoginNotices` from config.json, without a restart.
      operationId: adminCreateNotice
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4096, description: MHFML text }
                expires: { type: string, format: date-time }
      responses:
        "201":
          description: Created notice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }

  /v2/admin/notices/{id}:
    delete:
      summary: Remove a login notice
      operationId: adminDeleteNotice
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /v2/admin/distributions:
    get:
      summary: List gift-box distributions
      operationId: adminListDistributions
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Distributions (headers only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  distributions: { type: array, items: { $ref: "#/components/schemas/Distribution" } }
    post:
      summary: Create a distribution with its items
      description: |
        `characterId` null = every character. `type` and `items[].itemType`
        follow the Distribution enumerations on the wiki. `eventName`,
        `description` and `timesAcceptable` default to the game's GM-gift values.
      operationId: adminCreateDistribution
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Distribution"
                - type: object
                  required: [items]
                  properties:
                    items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/DistributionItem" } }
      responses:
        "201":
          description: Created distribution with its items
        "400": { description: No items, or a non-positive quantity }

  /v2/admin/distributions/{id}:
    get:
      summary: Distribution with its items
      operationId: adminGetDistribution
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Distribution and items }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a distribution and its items
      operationId: adminDeleteDistribution
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v2/admin/events:
    get:
      summary: List event rows (festa, diva, vs, mezfes)
      operationId: adminListEvents
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/AdminEvent" } }

  /v2/admin/events/{type}:
    put:
      summary: Start (or restart) an event cycle
      description: |
        Replaces every row of that type with one starting at `startTime`
        (default now). The game derives the whole schedule from that row, so
        this is how a Diva Defense or Festa cycle is restarted.
      operationId: adminStartEvent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [festa, diva, vs, mezfes] } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime: { type: string, format: date-time }
      responses:
        "200":
          description: The new event row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEvent" }
        "400": { description: Unknown event type }
    delete:
      summary: Stop an event (remove its rows)
      operationId: adminStopEvent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [festa, diva, vs, mezfes] } }]
      responses:
        "200":
          description: Number of rows removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }

  /mhf_file.php:
    get:
      summary: Game-file manifest or connectivity check (patch tree)
      description: |
        Served only when `API.PatchTree.Enabled` is set. Same shapes the original
        launcher (`mhl.dll`) issues; `?key=<n>` returns the CRC32 manifest
        (`CRC32,FILETIME_LO,FILETIME_HI,path,size,0` per line), `?chk=<n>` returns
        the literal `[mhf Check Message:0]`. `<n>` is a cache-buster. Plain HTTP only.
      operationId: getPatchManifest
      tags: [patch-tree]
      parameters:
        - in: query
          name: key
          schema: { type: integer }
          description: Request the manifest
        - in: query
          name: chk
          schema: { type: integer }
          description: Request the check message
      responses:
        "200":
          description: Manifest (application/octet-stream) or check message (text/plain)
        "404":
          description: Neither `key` nor `chk` given, or patch tree disabled
        "503":
          description: Manifest not generated yet

  /mhfdat/{kind}/{path}:
    get:
      summary: One game file from the patch tree
      description: Served only when `API.PatchTree.Enabled` is set. Supports Range requests.
      operationId: getPatchFile
      tags: [patch-tree]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [exe, dat] }
        - in: path
          name: path
          required: true
          schema: { type: string }
          description: Path under `mhfdat/<kind>/`, may contain slashes
        - in: query
          name: id
          schema: { type: integer }
          description: Cache-buster, ignored
      responses:
        "200":
          description: File contents (application/octet-stream)
        "206":
          description: Partial content
        "404":
          description: Not a regular file under exe/ or dat/, or patch tree disabled

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token returned by /v2/login or /v2/register

  parameters:
    characterId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint32
      description: Character ID

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: unauthorized
            message: Invalid or expired token
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal_error
            message: Internal server error

    Forbidden:
      description: Operator rights required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AdminUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        rights: { type: integer }
        op: { type: boolean }
        lastLogin: { type: string, format: date-time, nullable: true }
        discordId: { type: string, nullable: true }
        psnId: { type: string, nullable: true }
        banned: { type: boolean }
        banExpires: { type: string, format: date-time, nullable: true, description: null for a permanent ban or no ban }
    Notice:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    Distribution:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        characterId: { type: integer, nullable: true }
        type: { type: integer }
        deadline: { type: string, format: date-time, nullable: true }
        eventName: { type: string }
        description: { type: string }
        timesAcceptable: { type: integer }
        minHr: { type: integer, nullable: true }
        maxHr: { type: integer, nullable: true }
        minSr: { type: integer, nullable: true }
        maxSr: { type: integer, nullable: true }
        minGr: { type: integer, nullable: true }
        maxGr: { type: integer, nullable: true }
        rights: { type: integer, nullable: true }
        selection: { type: boolean, nullable: true }
    DistributionItem:
      type: object
      required: [itemType]
      properties:
        itemType: { type: integer }
        itemId: { type: integer, nullable: true }
        quantity: { type: integer, nullable: true }
    AdminEvent:
      type: object
      properties:
        id: { type: integer }
        eventType: { type: string, enum: [festa, diva, vs, mezfes] }
        startTime: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
          examples:
            - invalid_username
            - invalid_password
            - username_exists
            - missing_fields
            - invalid_request
            - unauthorized
            - internal_error
        message:
          type: string
          description: Human-readable error description

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthData:
      type: object
      required:
        - currentTs
        - expiryTs
        - entranceCount
        - notices
        - user
        - characters
        - courses
        - mezFes
        - patchServer
      properties:
        currentTs:
          type: integer
          format: uint32
          description: Current server timestamp (Unix seconds)
        expiryTs:
          type: integer
          format: uint32
          description: Return expiry timestamp (Unix seconds)
        entranceCount:
          type: integer
          format: uint32
        notices:
          type: array
          items:
            type: string
        user:
          $ref: "#/components/schemas/User"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseInfo"
        mezFes:
          oneOf:
            - $ref: "#/components/schemas/MezFes"
            - type: "null"
        patchServer:
          type: string

    User:
      type: object
      required: [tokenId, token, rights]
      properties:
        tokenId:
          type: integer
          format: uint32
        token:
          type: string
        rights:
          type: integer
          format: uint32

    Character:
      type: object
      required: [id, name, isFemale, weapon, hr, gr, lastLogin, returning]
      properties:
        id:
          type: integer
          format: uint32
        name:
          type: string
        isFemale:
          type: boolean
        weapon:
          type: integer
          format: uint32
        hr:
          type: integer
          format: uint32
        gr:
          type: integer
          format: uint32
        lastLogin:
          type: integer
          format: int32
          description: Unix timestamp of last login
        returning:
          type: boolean
          description: True if character has not logged in for 90+ days

    CourseInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: uint16
        name:
          type: string

    MezFes:
      type: object
      required: [id, start, end, soloTickets, groupTickets, stalls]
      properties:
        id:
          type: integer
          format: uint32
        start:
          type: integer
          format: uint32
        end:
          type: integer
          format: uint32
        soloTickets:
          type: integer
          format: uint32
        groupTickets:
          type: integer
          format: uint32
        stalls:
          type: array
          items:
            type: integer
            format: uint32

    LauncherResponse:
      type: object
      required: [banners, messages, links]
      properties:
        banners:
          type: array
          items:
            $ref: "#/components/schemas/Banner"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    Banner:
      type: object
      required: [src, link]
      properties:
        src:
          type: string
          description: Displayed image URL
        link:
          type: string
          description: Link accessed on click

    Message:
      type: object
      required: [message, date, kind, link]
      properties:
        message:
          type: string
          description: Displayed message
        date:
          type: integer
          format: int64
          description: Displayed date (Unix timestamp)
        kind:
          type: integer
          description: "0 = Default, 1 = New"
          enum: [0, 1]
        link:
          type: string
          description: Link accessed on click

    Link:
      type: object
      required: [name, icon, link]
      properties:
        name:
          type: string
          description: Displayed name
        icon:
          type: string
          description: Displayed icon (rendered as monochrome if transparent)
        link:
          type: string
          description: Link accessed on click

    VersionResponse:
      type: object
      required: [clientMode, name]
      properties:
        clientMode:
          type: string
          description: Supported game client version (e.g. "ZZ")
        name:
          type: string
          description: Server software name
          examples: ["Erupe-CE"]

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        error:
          type: string
          description: Error description (present only when unhealthy)

    ServerStatusResponse:
      type: object
      required: [mezFes, featuredWeapon, events]
      properties:
        mezFes:
          oneOf:
            - $ref: "#/components/schemas/MezFes"
            - type: "null"
        featuredWeapon:
          oneOf:
            - $ref: "#/components/schemas/FeatureWeaponInfo"
            - type: "null"
        events:
          $ref: "#/components/schemas/EventStatus"

    FeatureWeaponInfo:
      type: object
      required: [startTime, activeFeatures]
      properties:
        startTime:
